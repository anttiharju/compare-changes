name: "Compare changes"
description: "Conditionally run jobs and steps based on find-changes-action output."
branding:
  icon: minimize-2
  color: orange
inputs:
  paths:
    description: "Newline-separated inline path patterns. Mutually exclusive with 'workflow'; exactly one of the two must be set."
    required: false
    default: ""
  workflow:
    description: "Workflow file under .github/workflows/. Uses the on.push.paths as input. Mutually exclusive with 'paths'; exactly one of the two must be set."
    required: false
    default: ""
  changes:
    description: "JSON array of changed files (from anttiharju/find-changes-action)"
    required: true
  version:
    description: "compare-changes version to use, semver format without v prefix"
    required: false
    default: "$PKG_VERSION"
  debug:
    description: "Enable compare-changes --debug output (true/false)"
    required: false
    default: "false"
  validate:
    description: "Run 'compare-changes --validate' before comparing (true/false)"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Check if compare-changes is in PATH
      id: binary
      shell: sh
      run: |
        "$$GITHUB_ACTION_PATH/bin/binary.sh"
    - if: steps.binary.outputs.installed != 'true'
      name: Convert target
      id: convert
      shell: sh
      env:
        OS: ${{ runner.os }} # Possible values are Linux, Windows, or macOS.
        ARCH: ${{ runner.arch }} # Possible values are X86, X64, ARM, or ARM64.
      run: |
        "$$GITHUB_ACTION_PATH/bin/convert.sh"
    - if: steps.binary.outputs.installed != 'true'
      name: Cache
      id: cache
      uses: actions/cache@v6
      with:
        path: /usr/local/bin/compare-changes
        key: compare-changes_v${{ inputs.version }}_${{ steps.convert.outputs.target }}
    - if: steps.binary.outputs.installed != 'true' && steps.cache.outputs.cache-hit != 'true'
      name: Install
      working-directory: ${{ runner.temp }}
      shell: sh
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.version }}
        TARGET: ${{ steps.convert.outputs.target }}
      run: |
        "$$GITHUB_ACTION_PATH/bin/install.sh"
    - if: inputs.validate == 'true'
      name: Validate
      shell: sh
      run: |
        compare-changes --validate
    - name: Run
      id: run
      shell: bash
      env:
        WORKFLOW: ${{ inputs.workflow }}
        PATHS: ${{ inputs.paths }}
        CHANGES: ${{ inputs.changes }}
        DEBUG: ${{ inputs.debug }}
      run: |
        "$$GITHUB_ACTION_PATH/bin/run.sh"
outputs:
  changed:
    description: "Boolean indicating if any changed files match the configured paths (from 'paths' input or the workflow's on.push.paths)."
    value: ${{ steps.run.outputs.changed }}
