name: Compare changes
description: "Conditionally run jobs and steps based on find-changes-action output."
branding:
  icon: minimize-2
  color: orange
inputs:
  paths:
    description: "Newline-separated inline path patterns. Mutually exclusive with 'workflow'; exactly one of the two must be set."
    required: false
    default: ""
  workflow:
    description: "The workflow file under .github/workflows/ supplies the selected event paths. Exactly one of 'workflow' or 'paths' is required."
    required: false
    default: ""
  workflow-event:
    description: "Workflow event that supplies paths: push or pull_request. A nondefault value requires 'workflow'."
    required: false
    default: "push"
  changes:
    description: "JSON array of changed files (from anttiharju/find-changes-action)"
    required: true
  debug:
    description: "Enable compare-changes --debug output (true/false)"
    required: false
    default: "false"
  validate:
    description: "Run 'compare-changes --validate' before comparing (true/false)"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Prepare cache
      id: check
      shell: sh
      env:
        VERSION: "$PKG_VERSION"
      run: |
        "$$GITHUB_ACTION_PATH/scripts/cache.sh"
    - name: Generate target triple
      id: target
      shell: sh
      env:
        OS: ${{ runner.os }} # Possible values are Linux, Windows, or macOS.
        ARCH: ${{ runner.arch }} # Possible values are X86, X64, ARM, or ARM64.
      run: |
        "$$GITHUB_ACTION_PATH/scripts/target.sh"
    - if: steps.check.outputs.installed != 'true'
      name: Cache
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.check.outputs.directory }}/compare-changes
        key: compare-changes_${PKG_VERSION}_${{ steps.target.outputs.triple }}
    - if: steps.check.outputs.installed != 'true' && steps.cache.outputs.cache-hit != 'true'
      name: Download executable
      working-directory: ${{ steps.check.outputs.directory }}
      shell: sh
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: "$PKG_VERSION"
        TARGET: ${{ steps.target.outputs.triple }}
      run: |
        "$$GITHUB_ACTION_PATH/scripts/install.sh"
    - name: Verify checksum
      shell: sh
      env:
        BINARY: "${{ steps.check.outputs.directory }}/compare-changes"
        TARGET: ${{ steps.target.outputs.triple }}
        MACOS_ARM_SHA: "$PKG_MACOS_ARM_SHA"
        LINUX_ARM_SHA: "$PKG_LINUX_ARM_SHA"
        LINUX_X64_SHA: "$PKG_LINUX_X64_SHA"
      run: |
        "$$GITHUB_ACTION_PATH/scripts/verify.sh"
    - if: inputs.validate == 'true'
      name: Validate paths
      shell: sh
      env:
        BINARY: "${{ steps.check.outputs.directory }}/compare-changes"
      run: |
        "$$BINARY" --validate
    - name: Compare changes
      id: run
      shell: bash
      env:
        BINARY: "${{ steps.check.outputs.directory }}/compare-changes"
        WORKFLOW: "${{ inputs.workflow }}"
        WORKFLOW_EVENT: "${{ inputs.workflow-event }}"
        PATHS: "${{ inputs.paths }}"
        CHANGES: "${{ inputs.changes }}"
        DEBUG: "${{ inputs.debug }}"
      run: |
        "$$GITHUB_ACTION_PATH/scripts/run.sh"
outputs:
  changed:
    description: "Boolean indicating if any changed files match the configured paths (from 'paths' or the selected workflow event)."
    value: ${{ steps.run.outputs.changed }}
