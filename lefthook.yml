output:
  - success
  - failure

pre-push:
  parallel: true
  jobs:
    - glob: "{.cargo/*,src/*,tests/*,Cargo.lock,Cargo.toml}"
      run: cargo test --all-features

# Match to plan.yml
pre-commit:
  parallel: true
  jobs:
    - glob: "{.cargo/*,src/*,tests/*,Cargo.lock,Cargo.toml}"
      env:
        SDKROOT: /dev/null
      run: cargo build --all-features
    # action-validator does not play well with nix-direnv (it scans all files instead of ones in version control)
    # also disabled because it uses glob instead of this library
    # - name: action-validator
    #   run: git ls-files -z '.github/workflows/*.yml' '*/action.yml' | xargs -0 action-validator --verbose

    - name: actionlint
      glob: ".github/workflows/*.yml"
      run: actionlint -color

    # https://github.com/anttiharju/relcheck
    - name: relcheck
      run: relcheck all

    - name: editorconfig-checker
      run: editorconfig-checker {staged_files}

    - name: Keep .yml
      glob: "*.yaml"
      run: echo "You are trying to commit .yaml files. Please use .yml instead for the following files:" && echo {staged_files} && exit 1

    - glob: "{docs/*,mkdocs.yml}"
      run: mkdocs build --strict

    - name: prettier
      glob: "{*.yml,*.md}"
      run: prettier --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: rubocop
      glob: "{*.rb}"
      run: .release/render.sh brew && find .release/brew -name "*.rb" -type f -not -name "*template.rb" -and -not -name "*.tpl.rb" -exec rubocop {} \;

    - name: shellcheck
      glob: "{*.sh,.shellcheckrc}"
      run: git ls-files -z '*.sh' | xargs -0 shellcheck --color=always

    - name: nixfmt
      glob: "*.nix"
      run: nixfmt {staged_files}
      stage_fixed: true

    - glob: "*.rs"
      run: cargo fmt
      stage_fixed: true

    - glob: "src/*"
      run: scripts/exitcode.sh

    - glob: "*.rs"
      env:
        RUSTFLAGS: -Dwarnings
      run: cargo clippy --fix --allow-staged
      stage_fixed: true
