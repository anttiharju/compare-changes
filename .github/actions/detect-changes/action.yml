name: "Detect changes"
description: "Decide what steps need running based on changes"
inputs:
  changes:
    description: "JSON array of changed files"
    required: true
runs:
  using: "composite"
  steps:
    - id: actionlint
      uses: anttiharju/compare-changes-action@v0
      with:
        workflow: wildcard/actionlint.yml
        changes: ${{ inputs.changes }}
    - id: prettier
      uses: anttiharju/compare-changes-action@v0
      with:
        workflow: wildcard/prettier.yml
        changes: ${{ inputs.changes }}
    - id: action-compare
      uses: anttiharju/compare-changes-action@v0
      with:
        workflow: wildcard/release-action-compare.yml
        changes: ${{ inputs.changes }}
    - id: action-find
      uses: anttiharju/compare-changes-action@v0
      with:
        workflow: wildcard/release-action-find.yml
        changes: ${{ inputs.changes }}
    - id: brew
      uses: anttiharju/compare-changes-action@v0
      with:
        workflow: wildcard/release-brew.yml
        changes: ${{ inputs.changes }}
    # flake.yml is only used in the plan.yml container job
    - id: github
      uses: anttiharju/compare-changes-action@v0
      with:
        workflow: wildcard/release-github.yml
        changes: ${{ inputs.changes }}
    - id: nix
      uses: anttiharju/compare-changes-action@v0
      with:
        workflow: wildcard/release-nix.yml
        changes: ${{ inputs.changes }}
    - id: rs
      uses: anttiharju/compare-changes-action@v0
      with:
        workflow: wildcard/rs.yml
        changes: ${{ inputs.changes }}
    - id: rust
      uses: anttiharju/compare-changes-action@v0
      with:
        workflow: wildcard/rust.yml
        changes: ${{ inputs.changes }}
    - id: shellcheck
      uses: anttiharju/compare-changes-action@v0
      with:
        workflow: wildcard/shellcheck.yml
        changes: ${{ inputs.changes }}
    - id: src
      uses: anttiharju/compare-changes-action@v0
      with:
        workflow: wildcard/src.yml
        changes: ${{ inputs.changes }}
    - id: zensical
      uses: anttiharju/compare-changes-action@v0
      with:
        workflow: wildcard/zensical.yml
        changes: ${{ inputs.changes }}
    - id: zizmor
      uses: anttiharju/compare-changes-action@v0
      with:
        workflow: wildcard/zizmor.yml
        changes: ${{ inputs.changes }}
outputs:
  actionlint:
    description: "Whether actionlint has changed"
    value: ${{ steps.actionlint.outputs.changed }}
  # flake.yml is only used in the plan.yml container job
  prettier:
    description: "Whether Prettier has changed"
    value: ${{ steps.prettier.outputs.changed }}
  action-compare:
    description: "Whether action-compare has changed"
    value: ${{ steps.action-compare.outputs.changed }}
  action-find:
    description: "Whether action-find has changed"
    value: ${{ steps.action-find.outputs.changed }}
  brew:
    description: "Whether Brew has changed"
    value: ${{ steps.brew.outputs.changed }}
  github:
    description: "Whether GitHub has changed"
    value: ${{ steps.github.outputs.changed }}
  nix:
    description: "Whether Nix has changed"
    value: ${{ steps.nix.outputs.changed }}
  rs:
    description: "Whether *.rs has changed"
    value: ${{ steps.rs.outputs.changed }}
  rust:
    description: "Whether Rust has changed"
    value: ${{ steps.rust.outputs.changed }}
  shellcheck:
    description: "Whether ShellCheck has changed"
    value: ${{ steps.shellcheck.outputs.changed }}
  src:
    description: "Whether src has changed"
    value: ${{ steps.src.outputs.changed }}
  zensical:
    description: "Whether Zensical has changed"
    value: ${{ steps.zensical.outputs.changed }}
  zizmor:
    description: "Whether Zizmor has changed"
    value: ${{ steps.zizmor.outputs.changed }}

  release:
    description: "Whether any release has changed"
    value: ${{ steps.action-compare.outputs.changed || steps.action-find.outputs.changed || steps.brew.outputs.changed || steps.github.outputs.changed || steps.nix.outputs.changed }}
