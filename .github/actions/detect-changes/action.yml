name: "Detect changes"
description: "Decide what steps need running based on changes"
inputs:
  changes:
    description: "JSON array of changed files"
    required: true
runs:
  using: "composite"
  steps:
    - id: github_actions_workflows
      uses: anttiharju/compare-changes@v0.2.1
      with:
        github-workflows-wildcard: actionlint.yml
        changes: ${{ inputs.changes }}
    - id: rust
      uses: anttiharju/compare-changes@v0.2.1
      with:
        github-workflows-wildcard: rust.yml
        changes: ${{ inputs.changes }}
    - id: rs
      uses: anttiharju/compare-changes@v0.2.1
      with:
        github-workflows-wildcard: rs.yml
        changes: ${{ inputs.changes }}
    - id: brew
      uses: anttiharju/compare-changes@v0.2.1
      with:
        github-workflows-wildcard: brew.yml
        changes: ${{ inputs.changes }}
    - id: github
      uses: anttiharju/compare-changes@v0.2.1
      with:
        github-workflows-wildcard: github.yml
        changes: ${{ inputs.changes }}
    - id: nix
      uses: anttiharju/compare-changes@v0.2.1
      with:
        github-workflows-wildcard: nix.yml
        changes: ${{ inputs.changes }}
    - id: documentation
      uses: anttiharju/compare-changes@v0.2.1
      with:
        github-workflows-wildcard: mkdocs.yml
        changes: ${{ inputs.changes }}
    - id: md_and_yml
      uses: anttiharju/compare-changes@v0.2.1
      with:
        github-workflows-wildcard: prettier.yml
        changes: ${{ inputs.changes }}
    - id: scripts
      uses: anttiharju/compare-changes@v0.2.1
      with:
        github-workflows-wildcard: shellcheck.yml
        changes: ${{ inputs.changes }}
    - id: src
      uses: anttiharju/compare-changes@v0.2.1
      with:
        github-workflows-wildcard: src.yml
        changes: ${{ inputs.changes }}
    - id: action
      uses: anttiharju/compare-changes@v0.2.1
      with:
        github-workflows-wildcard: action.yml
        changes: ${{ inputs.changes }}
outputs:
  github_actions_workflows:
    description: "Whether GitHub Actions workflows have changed"
    value: ${{ steps.github_actions_workflows.outputs.changed }}
  rust:
    description: "Whether Rust has changed"
    value: ${{ steps.rust.outputs.changed }}
  rs:
    description: "Whether *.rs has changed"
    value: ${{ steps.rs.outputs.changed }}
  brew:
    description: "Whether Brew has changed"
    value: ${{ steps.brew.outputs.changed }}
  github:
    description: "Whether GitHub has changed"
    value: ${{ steps.github.outputs.changed }}
  nix:
    description: "Whether Nix has changed"
    value: ${{ steps.nix.outputs.changed }}
  release:
    description: "Whether any release has changed"
    value: ${{ steps.brew.outputs.changed || steps.github.outputs.changed || steps.nix.outputs.changed }}
  documentation:
    description: "Whether documentation has changed"
    value: ${{ steps.documentation.outputs.changed }}
  md_and_yml:
    description: "Whether Markdown or YAML has changed"
    value: ${{ steps.md_and_yml.outputs.changed }}
  scripts:
    description: "Whether scripts have changed"
    value: ${{ steps.scripts.outputs.changed }}
  src:
    description: "Whether src has changed"
    value: ${{ steps.src.outputs.changed }}
  action:
    description: "Whether action has changed"
    value: ${{ steps.action.outputs.changed }}
