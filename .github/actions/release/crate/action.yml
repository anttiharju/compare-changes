name: "Release to crates.io"
description: "Publish the Rust crate to crates.io"
inputs:
  version:
    description: "Version to release"
    required: true
runs:
  using: "composite"
  steps:
    - name: Patch Cargo.toml version
      shell: sh
      env:
        tag: "v${{ inputs.version }}"
      run: |
        version="${tag#v}"
        toml set Cargo.toml package.version "$version" > Cargo.toml.tmp && mv Cargo.toml.tmp Cargo.toml
        cargo update --offline --package "${GITHUB_REPOSITORY#*/}"

