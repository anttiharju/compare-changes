name: "Release to crates.io"
description: "Publish the Rust crate to crates.io"
inputs:
  cargo_registry_token:
    description: "Cargo registry token (crates.io) with publish-update scopes"
    required: true
runs:
  using: "composite"
  steps:
    - name: Authenticate
      uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
      id: auth
    - name: Publish
      shell: sh
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      run: |
        cargo publish --no-verify --all-features
