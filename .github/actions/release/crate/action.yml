name: "Release to crates.io"
description: "Publish the Rust crate to crates.io"
runs:
  using: "composite"
  steps:
    - name: Authenticate
      id: auth
      uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
    - name: Publish
      shell: sh
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      run: |
        cargo publish --no-verify --all-features
