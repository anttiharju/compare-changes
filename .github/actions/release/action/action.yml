name: "Release standalone action"
description: "Update standalone action repository for a new release"
inputs:
  action:
    description: "Action to release"
    required: true
  version:
    description: "Version to release"
    required: true
  anttiharju-bot-id:
    description: "GitHub App client ID for anttiharju[bot]"
    required: true
  anttiharju-bot-private-key:
    description: "GitHub App private key for anttiharju[bot]"
    required: true
runs:
  using: "composite"
  steps:
    - name: Calculate major version
      id: version
      shell: sh
      env:
        version: ${{ inputs.version }}
      run: |
        major="$(echo "$version" | cut -d. -f1)"
        echo "major=v$major" >> "$GITHUB_OUTPUT"
    - name: Save compare-changes upstream release notes
      shell: sh
      env:
        GH_TOKEN: ${{ github.token }}
        repository: ${{ github.repository }}
        tag: "v${{ inputs.version }}"
      run: |
        gh release view "$tag" --repo "$repository" --json body --jq .body > "$RUNNER_TEMP/release-notes.md"
    - name: Generate commit token
      id: generate-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.anttiharju-bot-id }}
        private-key: ${{ inputs.anttiharju-bot-private-key }}
        repositories: ${{ inputs.action }}-changes-action
        permission-contents: write
    - name: Checkout
      uses: actions/checkout@v7
      with:
        repository: anttiharju/${{ inputs.action }}-changes-action
        token: ${{ steps.generate-token.outputs.token }}
        path: release-${{ inputs.action }}
        persist-credentials: true
    - name: Update standalone repository
      shell: sh
      env:
        action: ${{ inputs.action }}
      run: |
        git -C "release-$action" rm -rf .
        .release/render.sh "action-$action" --output "release-$action"
        cp -r .release/"action-$action"/bin "release-$action/"
        cp .release/"action-$action"/README.md "release-$action/README.md"
        cp LICENSE "release-$action/LICENSE"
    - name: Commit changes
      uses: ./.github/actions/commit-changes
      with:
        author: anttiharju[bot]
        committer: anttiharju[bot]
        working-directory: release-${{ inputs.action }}
        message: |
          ${{ inputs.action }}-changes ${{ inputs.version }}
    - name: Tag current commit
      working-directory: release-${{ inputs.action }}
      shell: sh
      env:
        tag: "v${{ inputs.version }}"
      run: |
        git tag "$tag"
        git push --tags
    - name: Setup major version branch
      working-directory: release-${{ inputs.action }}
      shell: sh
      env:
        major_version: ${{ steps.version.outputs.major }}
      run: |
        git push origin "HEAD:$major_version"
    - name: Release action
      working-directory: release-${{ inputs.action }}
      shell: sh
      env:
        GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        title: ${{ inputs.version }}
        tag: "v${{ inputs.version }}"
      run: |
        gh release create "$tag" --title="$title" --notes-file "$RUNNER_TEMP/release-notes.md"
    - if: always()
      name: Cleanup
      shell: sh
      env:
        action: ${{ inputs.action }}
      run: |
        rm -rf "release-$action"
