name: semver-label
description: "Determines semantic version bump from PR labels"
inputs:
  require:
    description: "Whether to fail upon missing semver label"
    default: "true"
    required: false
  error-message:
    description: "Message to echo upon failure"
    required: false
    default: "PR must have exactly one of the following labels: major-release, minor-release, patch-release"
runs:
  using: "composite"
  steps:
    - name: Get labels
      id: label
      uses: anttiharju/actions/get-labels@v0

    - name: Check for major-release label
      id: major-release
      uses: anttiharju/actions/require-label@v0
      with:
        labels: ${{ steps.label.outputs.names }}
        name: "major-release"
        error-message: ${{ inputs.error-message }}

    - name: Check for minor-release label
      id: minor-release
      uses: anttiharju/actions/require-label@v0
      with:
        labels: ${{ steps.label.outputs.names }}
        name: "minor-release"
        error-message: ${{ inputs.error-message }}
        fail-on-match: ${{ steps.major-release.outputs.match }}

    - name: Check for patch-release label
      id: patch-release
      uses: anttiharju/actions/require-label@v0
      with:
        labels: ${{ steps.label.outputs.names }}
        name: "patch-release"
        error-message: ${{ inputs.error-message }}
        fail-on-match: ${{ steps.minor-release.outputs.match == 'true' || steps.major-release.outputs.match == 'true' }}

    - if: ${{ steps.major-release.outputs.match == 'false' && steps.minor-release.outputs.match == 'false' && steps.patch-release.outputs.match == 'false' }}
      id: fail
      name: Fail if no semver label matched
      shell: sh
      env:
        require: ${{ inputs.require }}
        msg: ${{ inputs.error-message }}
      run: |
        if [ "$require" = "true" ]; then
          echo "Error: $msg"
          exit 1
        else
          echo "skipped=true"
          echo "skipped=true" >> "$GITHUB_OUTPUT"
        fi

    # This is not baked into output value to avoid falsely setting release type if a step fails
    - if: steps.fail.outputs.skipped != 'true'
      name: Set output
      id: release
      shell: sh
      run: |
        echo "type=${{ steps.major-release.outputs.match == 'true' && 'major-release' || steps.minor-release.outputs.match == 'true' && 'minor-release' || steps.patch-release.outputs.match == 'true' && 'patch-release' }}" >> "$GITHUB_OUTPUT"

    - name: Parse latest release
      id: latest
      shell: sh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ -f Cargo.toml ]; then
          version=$(yq '.package.version' Cargo.toml)
        else
          version=$(gh release view --json name -q '.name' 2>/dev/null || echo '0.0.0')
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

        major-release="$(echo "$version" | cut -d. -f1)"
        minor-release="$(echo "$version" | cut -d. -f2)"
        patch-release="$(echo "$version" | cut -d. -f3)"
        {
          echo "major-release=$major-release"
          echo "minor-release=$minor-release"
          echo "patch-release=$patch-release"
        } >> "$GITHUB_OUTPUT"
        echo "current=$version(as-is)=$major-release.$minor-release.$patch-release(parsed)"

    - if: steps.fail.outputs.skipped != 'true'
      name: Bump version
      id: bump
      shell: bash
      env:
        type: ${{ steps.release.outputs.type }}
        major-release: ${{ steps.latest.outputs.major-release }}
        minor-release: ${{ steps.latest.outputs.minor-release }}
        patch-release: ${{ steps.latest.outputs.patch-release }}
      run: |
        if [[ "$type" == "major-release" ]]; then
          echo "version=$((major-release + 1)).0.0" >> "$GITHUB_OUTPUT"
        elif [[ "$type" == "minor-release" ]]; then
          echo "version=$major-release.$((minor-release + 1)).0" >> "$GITHUB_OUTPUT"
        elif [[ "$type" == "patch-release" ]]; then
          echo "version=$major-release.$minor-release.$((patch-release + 1))" >> "$GITHUB_OUTPUT"
        else
          echo "Invalid type: $type" >&2
          exit 1
        fi

    - if: steps.fail.outputs.skipped != 'true'
      name: Log next version
      shell: sh
      env:
        version: ${{ steps.bump.outputs.version }}
      run: |
        echo "next=$version"
outputs:
  version:
    description: "Next semantic version"
    value: "${{ steps.bump.outputs.version }}"
  type:
    description: "Type of semantic version bump"
    value: ${{ steps.release.outputs.type }}
