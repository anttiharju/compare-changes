rules:
  # This repository is not going to use any other CI containers than the flake-based one, which is fine and meant to be dynamic.
  unpinned-images:
    disable: true
  # Dependabot applies a 3-day default cooldown as of July 14 2026, so explicit per-ecosystem cooldown config is unnecessary.
  # https://github.blog/changelog/2026-07-14-dependabot-version-updates-introduce-default-package-cooldown/
  dependabot-cooldown:
    disable: true
  # Action providers listed here are either trusted or me, and I don't want the maintenance burden of pinning them.
  unpinned-uses:
    config:
      policies:
        "actions/*": ref-pin
        "anttiharju/*": ref-pin
        "cachix/*": ref-pin
