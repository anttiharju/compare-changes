name: Plan
permissions:
  contents: write
  pull-requests: none
on:
  pull_request:
    # https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#pull_request
    # defaults: opened, synchronize, reopened
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_call:
    outputs:
      version:
        description: "Version for the next release. Empty if no release is needed."
        value: ${{ github.event.repository.name != 'rust-starter' && jobs.validate.outputs.version || '' }}
      documentation:
        description: "Whether to update the documentation website"
        value: ${{ jobs.validate.outputs.documentation_changed == 'true' }}
      container:
        description: "Image in which all CI jobs should be ran"
        value: ${{ jobs.container.outputs.image }}
    secrets:
      ANTTIHARJU_BOT_ID:
        required: true
      ANTTIHARJU_BOT_PRIVATE_KEY:
        required: true

jobs:
  container:
    if: github.event.repository.name != 'rust-starter'
    name: Container
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Find changes
        id: changes
        uses: anttiharju/find-changes-action@v1
      - name: Compare changes
        id: flake
        uses: anttiharju/actions/compare-changes@v0
        with:
          wildcard: flake
          changes: ${{ steps.changes.outputs.array }}
      - if: steps.flake.outputs.changed == 'true'
        name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.05
          extra_nix_config: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - if: steps.flake.outputs.changed == 'true'
        name: Parse container version
        id: container
        run: |
          version="$(nix eval .#container_version --raw)"
          echo "version=$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          image_id="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-ci"
          image_id="$(echo "$image_id" | tr '[:upper:]' '[:lower:]')"
          echo "image_id=$image_id"
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
      - if: steps.flake.outputs.changed == 'true'
        run: |
          nix build .#ci
      - if: steps.flake.outputs.changed == 'true'
        run: |
          ./result | docker load
      - if: steps.flake.outputs.changed == 'true'
        name: Tag image
        id: tag
        env:
          image_id: ${{ steps.container.outputs.image_id }}
          version: ${{ steps.container.outputs.version }}
          latest: ${{ github.event_name == 'pull_request' && steps.container.outputs.version || 'latest' }}
        run: |
          docker tag "ci:$version" "$image_id:$latest"
          echo "image=$image_id:$latest"
          echo "image=$image_id:$latest" >> "$GITHUB_OUTPUT"
      - if: steps.flake.outputs.changed == 'true'
        name: Log in to registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - if: steps.flake.outputs.changed == 'true'
        name: Push image
        env:
          image: ${{ steps.tag.outputs.image }}
        run: |
          local_digest="$(docker inspect "$image" --format='{{.Id}}')"
          remote_digest="$(docker manifest inspect "$image" | jq -r '.config.digest')"
          if [[ "$local_digest" != "$remote_digest" ]]; then
            docker push "$image"
          fi
    outputs:
      image: ${{ steps.tag.outputs.image }}

  validate:
    name: Validate
    needs: container
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    container:
      image: ${{ needs.container.outputs.image || format('ghcr.io/{0}/{1}-ci:latest', github.repository_owner, github.event.repository.name) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - name: Find changes
        id: changes
        uses: anttiharju/find-changes-action@v1

      - name: Detect changes
        id: changed
        uses: ./.github/actions/detect-changes
        with:
          changes: ${{ steps.changes.outputs.array }}

      - env:
          TARGET: aarch64-apple-darwin
          CC: ./.release/zcc.sh
          SDKROOT: /dev/null
        run: |
          cargo build --target aarch64-apple-darwin
      - env:
          TARGET: aarch64-unknown-linux-gnu
          CC: ./.release/zcc.sh
        run: |
          cargo build --target aarch64-unknown-linux-gnu
          readelf --dynamic "target/$TARGET/debug/compare-changes"
      - env:
          TARGET: x86_64-unknown-linux-gnu
          CC: ./.release/zcc.sh
        run: |
          cargo build --target x86_64-unknown-linux-gnu
          readelf --dynamic "target/$TARGET/debug/compare-changes"

      - if: always() && !cancelled() && (steps.changed.outputs.binary == 'true' || steps.changed.outputs.release == 'true' || github.event_name == 'push') && ! endsWith(github.actor, '[bot]')
        id: semantic
        name: Require semantic version label
        uses: anttiharju/actions/semver-label@v0
        with:
          require: ${{ steps.changed.outputs.binary == 'true' || steps.changed.outputs.release == 'true' }}

      - if: always() && !cancelled()
        name: action-validator
        run: |
          git ls-files -z ".github/*/*.yml" "*/action.yml" | xargs -0 action-validator --verbose

      - if: always() && !cancelled() && (steps.changed.outputs.github_actions_workflows == 'true' || github.event_name == 'push')
        name: actionlint
        run: |
          actionlint -color

      - if: always() && !cancelled()
        name: relcheck
        run: |
          relcheck all --verbose --color=always

      - if: always() && !cancelled()
        name: EditorConfig-Checker
        run: |
          git ls-files -z | xargs -0 editorconfig-checker

      - if: always() && !cancelled()
        name: Keep .yml
        run: |
          YAML_FILES=$(git ls-files -z '*.yaml')
          if [ -n "$YAML_FILES" ]; then
            echo "Found the following .yaml files. Please use .yml extension instead."
            echo "$YAML_FILES" | tr '\0' '\n'
            exit 1
          fi
          echo "No .yaml files found. Good job!"

      - if: always() && !cancelled() && (steps.changed.outputs.documentation == 'true' || github.event_name == 'push')
        name: mkdocs
        run: mkdocs build --strict

      - if: always() && !cancelled() && (steps.changed.outputs.md_and_yml == 'true' || github.event_name == 'push')
        name: prettier
        run: |
          prettier "{*.yml,*.md}" --check

      - if: always() && !cancelled() && (steps.changed.outputs.brew == 'true' || github.event_name == 'push')
        name: Rubocop formula
        uses: ./.github/actions/rubocop-formula

      - if: always() && !cancelled() && (steps.changed.outputs.scripts == 'true' || github.event_name == 'push')
        name: shellcheck
        run: |
          git ls-files -z '*.sh' | xargs -0 shellcheck --color=always

      - if: steps.semantic.outputs.version != '' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && !endsWith(github.actor, '[bot]')
        name: Create release commit
        uses: ./.github/actions/commit-release
        with:
          version: ${{ steps.semantic.outputs.version }}
          ANTTIHARJU_BOT_ID: ${{ secrets.ANTTIHARJU_BOT_ID }}
          ANTTIHARJU_BOT_PRIVATE_KEY: ${{ secrets.ANTTIHARJU_BOT_PRIVATE_KEY }}

      - if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && endsWith(github.event.head_commit.author.name, '[bot]')
        id: parse
        name: Parse release commit
        run: |
          commit_author="$(git log -1 --pretty=format:'%an')"
          commit_committer="$(git log -1 --pretty=format:'%cn')"
          expected_bot="${{ github.actor }}"

          if [[ "$commit_author" == "$expected_bot" && "$commit_committer" == "$expected_bot" ]]; then
            commit_message="$(git log -1 --pretty=format:'%s')"
            if [[ "$commit_message" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "version=$commit_message"
              echo "version=$commit_message" >> "$GITHUB_OUTPUT"
            else
              echo "Commit message does not match semver format: $commit_message"
            fi
          else
            echo "Author or committer does not match expected bot: $expected_bot"
            echo "Author: $commit_author, Committer: $commit_committer"
          fi
    outputs:
      version: ${{ steps.semantic.outputs.version || steps.parse.outputs.version }}
      documentation_changed: ${{ steps.changed.outputs.documentation }}
