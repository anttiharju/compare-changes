name: Build
permissions: {}
on:
  push:
    branches:
      - main

jobs:
  wait:
    name: Wait for earlier builds
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait for earlier builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?branch=main&event=push&per_page=100" \
            --jq ".workflow_runs[] | select(.run_number < $GITHUB_RUN_NUMBER and .status != \"completed\") | .id")
          for run in $runs; do
            gh run watch "$run" --repo "$GITHUB_REPOSITORY" --interval 30
          done

  plan:
    name: Plan
    needs: wait
    uses: ./.github/workflows/plan.yml
    permissions:
      contents: read
      packages: write
      pull-requests: read

  release:
    name: Release
    needs: plan
    runs-on: ubuntu-latest
    environment: release
    container:
      image: ${{ needs.plan.outputs.container }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    if: needs.plan.outputs.version != ''
    permissions:
      pages: write
      contents: write
      id-token: write
    env:
      CHECKSUM_MODE: local # Calculate checksums with locally built binaries instead of downloading from GitHub
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: GitHub
        uses: ./.github/actions/release/github
        with:
          version: ${{ needs.plan.outputs.version }}

      - name: Nix User Repository
        uses: ./.github/actions/release/nur-packages
        with:
          version: ${{ needs.plan.outputs.version }}
          anttiharju-bot-id: ${{ vars.ANTTIHARJU_BOT_ID }}
          anttiharju-bot-private-key: ${{ secrets.ANTTIHARJU_BOT_PRIVATE_KEY }}

      - name: crates.io
        uses: ./.github/actions/release/crate
        with:
          version: ${{ needs.plan.outputs.version }}

      - name: Homebrew tap
        uses: ./.github/actions/release/homebrew-tap
        with:
          version: ${{ needs.plan.outputs.version }}
          anttiharju-bot-id: ${{ vars.ANTTIHARJU_BOT_ID }}
          anttiharju-bot-private-key: ${{ secrets.ANTTIHARJU_BOT_PRIVATE_KEY }}

      - name: compare-changes-action
        uses: ./.github/actions/release/action
        with:
          action: compare
          version: ${{ needs.plan.outputs.version }}
          anttiharju-bot-id: ${{ vars.ANTTIHARJU_BOT_ID }}
          anttiharju-bot-private-key: ${{ secrets.ANTTIHARJU_BOT_PRIVATE_KEY }}

      - name: find-changes-action
        uses: ./.github/actions/release/action
        with:
          action: find
          version: ${{ needs.plan.outputs.version }}
          anttiharju-bot-id: ${{ vars.ANTTIHARJU_BOT_ID }}
          anttiharju-bot-private-key: ${{ secrets.ANTTIHARJU_BOT_PRIVATE_KEY }}

      - name: filter-changes-action
        uses: ./.github/actions/release/action
        with:
          action: filter
          version: ${{ needs.plan.outputs.version }}
          anttiharju-bot-id: ${{ vars.ANTTIHARJU_BOT_ID }}
          anttiharju-bot-private-key: ${{ secrets.ANTTIHARJU_BOT_PRIVATE_KEY }}

      - name: Documentation
        uses: ./.github/actions/release/documentation

      - name: Lock release immutability
        env:
          GH_TOKEN: ${{ github.token }}
          tag: "v${{ needs.plan.outputs.version }}"
        run: |
          gh release edit "$tag" --draft=false
