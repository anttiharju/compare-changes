name: Build
permissions:
  contents: none
  pull-requests: none
on:
  push:
    branches:
      - main

jobs:
  plan:
    name: Plan
    uses: ./.github/workflows/plan.yml
    permissions:
      contents: write
      packages: write
    secrets: inherit

  release:
    name: Release
    needs: plan
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.plan.outputs.container }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    if: endsWith(github.event.head_commit.author.name, '[bot]') && needs.plan.outputs.version != ''
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: GitHub
        uses: ./.github/actions/release/github
        with:
          version: ${{ needs.plan.outputs.version }}
          anttiharju-bot-id: ${{ secrets.ANTTIHARJU_BOT_ID }}
          anttiharju-bot-private-key: ${{ secrets.ANTTIHARJU_BOT_PRIVATE_KEY }}

      - name: Nix User Repository
        uses: ./.github/actions/release/nur-packages
        with:
          version: ${{ needs.plan.outputs.version }}
          anttiharju-bot-id: ${{ secrets.ANTTIHARJU_BOT_ID }}
          anttiharju-bot-private-key: ${{ secrets.ANTTIHARJU_BOT_PRIVATE_KEY }}

      - name: crates.io
        uses: ./.github/actions/release/crate
        with:
          cargo_registry_token: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Homebrew Tap
        uses: ./.github/actions/release/homebrew-tap
        with:
          version: ${{ needs.plan.outputs.version }}
          anttiharju-bot-id: ${{ secrets.ANTTIHARJU_BOT_ID }}
          anttiharju-bot-private-key: ${{ secrets.ANTTIHARJU_BOT_PRIVATE_KEY }}

      - name: Action
        uses: ./.github/actions/release/action
        with:
          version: ${{ needs.plan.outputs.version }}
          anttiharju-bot-id: ${{ secrets.ANTTIHARJU_BOT_ID }}
          anttiharju-bot-private-key: ${{ secrets.ANTTIHARJU_BOT_PRIVATE_KEY }}

      - name: Documentation
        uses: ./.github/actions/release/documentation

      - name: Lock release immutability
        shell: sh
        env:
          GH_TOKEN: ${{ github.token }}
          tag: "v${{ needs.plan.outputs.version }}"
        run: |
          gh release edit "$tag" --draft=false
