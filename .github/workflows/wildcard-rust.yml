permissions:
  contents: none
  pull-requests: none
on:
  push:
    branches:
      - wildcard
    paths:
      - ".cargo/**/*"
      - "src/**/*"
      - "tests/**/*"
      - "Cargo.lock"
      - "Cargo.toml"
      - "flake.nix"
      - "flake.lock"
jobs:
  wildcard:
    runs-on: ubuntu-latest
    steps:
      - run: |
          true
