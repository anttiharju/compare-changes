permissions:
  contents: none
  pull-requests: none
on:
  push:
    branches:
      - wildcard
    paths:
      - ".cargo/**/*"
      - "src/**/*"
      - "tests/**/*"
      - "Cargo.lock"
      - "Cargo.toml"

jobs:
  wildcard:
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: |
          true
