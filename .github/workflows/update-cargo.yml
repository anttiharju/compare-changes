name: Update Cargo.lock
permissions: {}
on:
  schedule:
    - cron: "43 6 * * 1"

concurrency:
  group: update-cargo
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'anttiharju/compare-changes'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Update lockfile and check cooldown
        id: update
        run: |
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock"
          cargo update
          python3 .github/scripts/cargo-cooldown.py "$RUNNER_TEMP/Cargo.lock"

      - if: steps.update.outputs.changed == 'true'
        name: Generate pull request token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.ANTTIHARJU_BOT_ID }}
          private-key: ${{ secrets.ANTTIHARJU_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - if: steps.update.outputs.changed == 'true'
        name: Create or update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.token.outputs.token }}
          add-paths: Cargo.lock
          branch: automation/cargo-update
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
          author: anttiharju[bot] <anttiharju[bot]@users.noreply.github.com>
          committer: anttiharju[bot] <anttiharju[bot]@users.noreply.github.com>
          commit-message: Update Cargo.lock
          title: Update Cargo.lock
          body: |
            This PR updates Cargo.lock with the stable Cargo toolchain.
            Every new crates.io version, including transitive dependencies, passed the 72-hour publication cooldown.
          labels: patch-release
