name: Release
permissions:
  contents: write
  pull-requests: none
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      container:
        required: true
        type: string
    secrets:
      ANTTIHARJU_BOT_ID:
        required: true
      ANTTIHARJU_BOT_PRIVATE_KEY:
        required: true
      CRATES_IO_PUBLISH_TOKEN:
        required: true

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.container || format('ghcr.io/{0}/{1}-ci:latest', github.repository_owner, github.event.repository.name) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    permissions:
      contents: write
    steps:
      - name: Generate deploy token
        id: deploy
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ANTTIHARJU_BOT_ID }}
          private-key: ${{ secrets.ANTTIHARJU_BOT_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.deploy.outputs.token }}
      - name: Deploy to GitHub Pages
        env:
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: "${{ github.actor }}@users.noreply.github.com"
          GIT_COMMITTER_NAME: "${{ github.actor }}[bot]"
          GIT_COMMITTER_EMAIL: "${{ github.actor }}[bot]@users.noreply.github.com"
        run: |
          mkdocs gh-deploy --force --no-history

  nur-packages:
    name: Nix
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.container || format('ghcr.io/{0}/{1}-ci:latest', github.repository_owner, github.event.repository.name) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Generate commit token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ANTTIHARJU_BOT_ID }}
          private-key: ${{ secrets.ANTTIHARJU_BOT_PRIVATE_KEY }}
          repositories: nur-packages
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: anttiharju/nur-packages
          token: ${{ steps.generate-token.outputs.token }}
          path: nur-packages
      - working-directory: nur-packages
        run: nix flake update
      - name: Source values and render template # TODO: use release/render.sh for this, needs output param
        env:
          GH_TOKEN: ${{ github.token }} # values script may use gh cli that needs this
          output: nur-packages/pkgs/${{ github.event.repository.name }}
        run: |
          source .release/nix/values.sh
          mkdir -p "$output"
          envsubst -i .release/nix/template.nix -no-unset -no-empty > "$output/default.nix"
          cp Cargo.lock "$output/Cargo.lock"
      - name: Commit changes
        uses: anttiharju/actions/commit-changes@v0
        with:
          working-directory: nur-packages
          committer: ${{ github.actor }}
          message: |
            ${{ github.event.repository.name }} ${{ inputs.version }}

            https://github.com/${{ github.repository }}/blob/${{ github.sha }}/.github/workflows/release.yml

  github:
    name: GitHub
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.container || format('ghcr.io/{0}/{1}-ci:latest', github.repository_owner, github.event.repository.name) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    env:
      tag: "v${{ inputs.version }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Tag current commit
        run: |
          git tag "$tag"
      - name: Cache
        uses: ./.github/actions/cache
      - name: Create aarch64-unknown-linux-gnu archive
        run: |
          .release/archive.sh "$tag" aarch64-unknown-linux-gnu
      - name: Create x86_64-unknown-linux-gnu archive
        run: |
          .release/archive.sh "$tag" x86_64-unknown-linux-gnu
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          title: ${{ inputs.version }}
        run: |
          git push origin "$tag"
          gh release create "$tag" --title="$title" --generate-notes --draft
          find . -maxdepth 1 -name '${{ github.event.repository.name }}-*.tar.gz' -exec gh release upload "$tag" {} \;
          gh release edit "$tag" --draft=false
      - name: Tag major version
        env:
          version: ${{ inputs.version }}
        run: |
          major_version=$(echo "$version" | cut -d. -f1)
          major_tag="v$major_version"
          git tag "$major_tag"
          git push origin "$major_tag" --force

  crate:
    name: crates.io
    needs: github
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.container || format('ghcr.io/{0}/{1}-ci:latest', github.repository_owner, github.event.repository.name) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Publish to crates.io
        env:
          CRATES_IO_PUBLISH_TOKEN: ${{ secrets.CRATES_IO_PUBLISH_TOKEN }}
        run: |
          cargo publish --all-features --token "$CRATES_IO_PUBLISH_TOKEN"

  action:
    name: Action
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.container || format('ghcr.io/{0}/{1}-ci:latest', github.repository_owner, github.event.repository.name) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    env:
      tag: "v${{ inputs.version }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Calculate major version
        id: version
        env:
          version: ${{ inputs.version }}
        run: |
          major="$(echo "$version" | cut -d. -f1)"
          echo "major=v$major" >> "$GITHUB_OUTPUT"
      - name: Generate commit token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ANTTIHARJU_BOT_ID }}
          private-key: ${{ secrets.ANTTIHARJU_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}-action
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: anttiharju/${{ github.event.repository.name }}-action
          token: ${{ steps.generate-token.outputs.token }}
          path: action
      - name: Update standalone repository
        working-directory: action
        run: |
          mv ../README.md README.md
          mv ../LICENSE LICENSE
      - name: Commit changes
        uses: anttiharju/actions/commit-changes@v0
        with:
          working-directory: action
          committer: ${{ github.actor }}
          message: |
            ${{ github.event.repository.name }} ${{ inputs.version }}

            https://github.com/${{ github.repository }}/blob/${{ github.sha }}/.github/workflows/release.yml
      - name: Tag current commit
        working-directory: action
        run: |
          git tag "$tag"
          git push --tags
      - name: Setup major version branch
        working-directory: action
        env:
          major_version: ${{ steps.version.outputs.major }}
        run: |
          git push origin "HEAD:$major_version"
