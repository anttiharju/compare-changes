name: Release
permissions:
  contents: write
  pull-requests: none
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      container:
        required: true
        type: string
    secrets:
      ANTTIHARJU_BOT_ID:
        required: true
      ANTTIHARJU_BOT_PRIVATE_KEY:
        required: true

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.container || format('ghcr.io/{0}/{1}-ci:latest', github.repository_owner, github.event.repository.name) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    permissions:
      contents: write
    steps:
      - name: Generate deploy token
        id: deploy
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ANTTIHARJU_BOT_ID }}
          private-key: ${{ secrets.ANTTIHARJU_BOT_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.deploy.outputs.token }}
      - name: Deploy to GitHub Pages
        env:
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: "${{ github.actor }}@users.noreply.github.com"
          GIT_COMMITTER_NAME: "${{ github.actor }}[bot]"
          GIT_COMMITTER_EMAIL: "${{ github.actor }}[bot]@users.noreply.github.com"
        run: |
          mkdocs gh-deploy --force --no-history

  nur-packages:
    name: Nix
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.container || format('ghcr.io/{0}/{1}-ci:latest', github.repository_owner, github.event.repository.name) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Generate commit token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ANTTIHARJU_BOT_ID }}
          private-key: ${{ secrets.ANTTIHARJU_BOT_PRIVATE_KEY }}
          repositories: nur-packages
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: anttiharju/nur-packages
          token: ${{ steps.generate-token.outputs.token }}
          path: nur-packages
      - name: Source values and render template # TODO: use release/render.sh for this, needs output param
        env:
          GH_TOKEN: ${{ github.token }} # values script may use gh cli that needs this
          output: nur-packages/pkgs/${{ github.event.repository.name }}
        run: |
          source .release/nix/values.sh
          mkdir -p "$output"
          envsubst -i .release/nix/template.nix -no-unset -no-empty > "$output/default.nix"
          cp Cargo.lock "$output/Cargo.lock"
      - name: Commit changes
        uses: anttiharju/actions/commit-changes@v0
        with:
          working-directory: nur-packages
          committer: ${{ github.actor }}
          message: |
            Update ${{ github.event.repository.name }} to ${{ inputs.version }}

            https://github.com/${{ github.repository }}/blob/${{ github.sha }}/.github/workflows/release.yml

  github:
    name: GitHub
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.container || format('ghcr.io/{0}/{1}-ci:latest', github.repository_owner, github.event.repository.name) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    env:
      tag: "v${{ inputs.version }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Tag current commit
        shell: sh
        run: |
          git tag "$tag"
      - name: Create aarch64-apple-darwin archive
        env:
          target: aarch64-apple-darwin
          SDKROOT: /dev/null
        run: |
          ./.release/archive.sh "$tag" "$target"
      - name: Create x86_64-unknown-linux-gnu archive
        env:
          target: x86_64-unknown-linux-gnu
        run: |
          ./.release/archive.sh "$tag" "$target"
      - name: Create aarch64-unknown-linux-gnu archive
        env:
          target: aarch64-unknown-linux-gnu
        run: |
          ./.release/archive.sh "$tag" "$target"
      - name: Release
        shell: sh
        env:
          GH_TOKEN: ${{ github.token }}
          title: ${{ inputs.version }}
        run: |
          git push origin "$tag"
          gh release create "$tag" --title="$title" --generate-notes --draft
          find . -maxdepth 1 -name '${{ github.event.repository.name }}-*.tar.gz' -exec gh release upload "$tag" {} \;
          gh release edit "$tag" --draft=false
      - name: Tag major version
        shell: sh
        env:
          version: ${{ inputs.version }}
        run: |
          major_version=$(echo "$version" | cut -d. -f1)
          major_tag="v${major_version}"
          git tag "$major_tag"
          git push origin "$major_tag" --force

  homebrew-tap:
    name: Homebrew
    needs: github # Relies on binaries uploaded to the GitHub release
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.container || format('ghcr.io/{0}/{1}-ci:latest', github.repository_owner, github.event.repository.name) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Generate commit token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ANTTIHARJU_BOT_ID }}
          private-key: ${{ secrets.ANTTIHARJU_BOT_PRIVATE_KEY }}
          repositories: homebrew-tap
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: anttiharju/homebrew-tap
          token: ${{ steps.generate-token.outputs.token }}
          path: homebrew-tap
      - name: Source values and render template # TODO: use release/render.sh for this, needs output param
        env:
          GH_TOKEN: ${{ github.token }} # values script may use gh cli that needs this
          output: homebrew-tap/Formula/${{ github.event.repository.name }}.rb
        run: |
          source .release/brew/values.sh
          mkdir -p "$(dirname "$output")"
          envsubst -i .release/brew/template.rb -no-unset -no-empty > "$output"
      - name: Commit changes
        uses: anttiharju/actions/commit-changes@v0
        with:
          working-directory: homebrew-tap
          committer: ${{ github.actor }}
          message: |
            Update ${{ github.event.repository.name }} to ${{ inputs.version }}

            https://github.com/${{ github.repository }}/blob/${{ github.sha }}/.github/workflows/release.yml
